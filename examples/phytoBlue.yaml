# Rotating globe from NASA SVS "Phytoplankton ... Blue Marble" (animation
# 3639, https://svs.gsfc.nasa.gov/3639/), downloaded manually to
# data/phytoBlue_60fps.mp4: 1280x720, 60 fps, 25 s (1500 frames).
# Credit: NASA's Goddard Space Flight Center.
#
#   gen-video-frames find-loops examples/phytoBlue.yaml
#   gen-video-frames generate examples/phytoBlue.yaml

VIDEO_FILE: data/phytoBlue_60fps.mp4

# The globe is 640 px across (x=320-959, y=40-680), centred in the frame.
# Crop a full-height square around it (x=280-1000), leaving a thin black
# margin so the edge of the globe shows as a circle on the display.
CROP_X_FRAC: [0.21875, 0.78125]
CROP_Y_FRAC: [0.0, 1.0]

LED_FRAMES_FILE: data/phytoBlue_leds.npz

# Loop search: is the 25 s one seamless full rotation?
MIN_LOOP_SECONDS: 20
MAX_LOOP_SECONDS: 24.9
SEAM_HALF_WINDOW_SECONDS: 0.1
N_CANDIDATES: 5
LOOP_CANDIDATES_FILE: data/phytoBlue_loop_candidates.csv
LOOP_SEAMS_DIR: data/phytoBlue_loop_seams

# Frame 1499 repeats frame 0 (RMS LED difference 0.49, vs. ~1.3 between
# consecutive frames), so frames 0-1498 are exactly one 360 degree
# rotation and loop seamlessly (1498 -> 0 step: 1.3).
START_FRAME: 0
END_FRAME: 1499

DIMNESS: 6
OUTPUT_FILE: data/phytoBlue_frames.npz

# Preview (`preview`): the output as it will look on the display.
PREVIEW_IMAGE: data/phytoBlue_preview.png
PREVIEW_VIDEO: data/phytoBlue_preview.mp4
PREVIEW_FPS: 24
