[project]
name = "gen-video-frames"
version = "0.1.0"
description = "Generate LED frame data for the display1593 LED display from YouTube or local video, specified by a YAML file."
requires-python = ">=3.10"
# Also needs display1593 (for display1593.image_conversion) - not on PyPI,
# and its hardware dependencies aren't needed here, so install it
# separately with --no-deps (see README.md).
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "pyyaml",
    "yt-dlp",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gen-video-frames = "gen_video_frames.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
